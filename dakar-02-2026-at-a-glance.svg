<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740"><rect x="0" y="0" width="1200" height="740" fill="#10161f"/><text x="60" y="66" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#d64933" letter-spacing="2.5">THE FORMAT, IN NUMBERS</text><text x="60" y="112" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900" fill="#f4efe4" letter-spacing="0.5">Dakar 2026 at a Glance</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#c9a876" text-anchor="start" letter-spacing="0"><tspan x="60" dy="0">Fourteen days of racing, one rest day, and a winner decided the hard way: by time, not points.</tspan></text><line x1="60" y1="170" x2="1140" y2="170" stroke="rgba(244,239,228,0.30)" stroke-width="1"/><rect x="60" y="200" width="360" height="130" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)" stroke-width="1"/><rect x="60" y="200" width="4" height="130" rx="2" fill="#d64933"/><text x="82" y="267.6" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="bold" fill="#f4efe4">15</text><text x="82" y="293.6" font-family="Arial, Helvetica, sans-serif" font-size="12.2" font-weight="normal" fill="#c9a876" text-anchor="start" letter-spacing="0"><tspan x="82" dy="0">Days total, Jan 3–17 — Yanbu to Yanbu</tspan></text><rect x="450" y="200" width="360" height="130" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)" stroke-width="1"/><rect x="450" y="200" width="4" height="130" rx="2" fill="#e8b84b"/><text x="472" y="267.6" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="bold" fill="#f4efe4">14</text><text x="472" y="293.6" font-family="Arial, Helvetica, sans-serif" font-size="12.2" font-weight="normal" fill="#c9a876" text-anchor="start" letter-spacing="0"><tspan x="472" dy="0">Prologue + 13 timed stages</tspan></text><rect x="840" y="200" width="360" height="130" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)" stroke-width="1"/><rect x="840" y="200" width="4" height="130" rx="2" fill="#d64933"/><text x="862" y="267.6" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="bold" fill="#f4efe4">7,994 km</text><text x="862" y="293.6" font-family="Arial, Helvetica, sans-serif" font-size="12.2" font-weight="normal" fill="#c9a876" text-anchor="start" letter-spacing="0"><tspan x="862" dy="0">Total route distance (cars)</tspan></text><rect x="60" y="360" width="360" height="130" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)" stroke-width="1"/><rect x="60" y="360" width="4" height="130" rx="2" fill="#e8b84b"/><text x="82" y="427.6" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="bold" fill="#f4efe4">4,880 km</text><text x="82" y="453.6" font-family="Arial, Helvetica, sans-serif" font-size="12.2" font-weight="normal" fill="#c9a876" text-anchor="start" letter-spacing="0"><tspan x="82" dy="0">Timed special-stage distance</tspan></text><rect x="450" y="360" width="360" height="130" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)" stroke-width="1"/><rect x="450" y="360" width="4" height="130" rx="2" fill="#d64933"/><text x="472" y="427.6" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="bold" fill="#f4efe4">1</text><text x="472" y="453.6" font-family="Arial, Helvetica, sans-serif" font-size="12.2" font-weight="normal" fill="#c9a876" text-anchor="start" letter-spacing="0"><tspan x="472" dy="0">Rest day, roughly at the halfway point, in Riyadh</tspan></text><rect x="840" y="360" width="360" height="130" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)" stroke-width="1"/><rect x="840" y="360" width="4" height="130" rx="2" fill="#e8b84b"/><text x="862" y="427.6" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="bold" fill="#f4efe4">2×</text><text x="862" y="453.6" font-family="Arial, Helvetica, sans-serif" font-size="12.2" font-weight="normal" fill="#c9a876" text-anchor="start" letter-spacing="0"><tspan x="862" dy="0">Marathon stages — zero outside mechanical help</tspan><tspan x="862" dy="15">overnight</tspan></text><rect x="60" y="540" width="1080" height="150" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)"/><text x="90" y="580" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#d64933" letter-spacing="2">HOW THE WINNER IS DECIDED</text><text x="90" y="608" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#f4efe4" text-anchor="start" letter-spacing="0"><tspan x="90" dy="0">Every stage finishing time is added to a running total. Whoever has the lowest combined time across all 13 stages wins</tspan><tspan x="90" dy="21">their category — not the most stage wins, not points. You can win six stages and still lose the rally to one bad afternoon</tspan><tspan x="90" dy="21">in soft sand.</tspan></text><text x="1140" y="712" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#5b6472" text-anchor="end" letter-spacing="0.5">Dakar Rally 2026 · Saudi Arabia</text><text x="60" y="712" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#5b6472" letter-spacing="0.5">DAKAR RALLY GUIDE — INDIA</text></svg>