<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620"><rect x="0" y="0" width="1200" height="620" fill="#10161f"/><text x="60" y="66" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#d64933" letter-spacing="2.5">THE ORIGIN STORY</text><text x="60" y="112" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900" fill="#f4efe4" letter-spacing="0.5">From Lost to Legendary</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#c9a876" text-anchor="start" letter-spacing="0"><tspan x="60" dy="0">How a French rider who nearly died in the Ténéré desert turned getting lost into a 48-year-old race across three continents.</tspan></text><line x1="60" y1="170" x2="1140" y2="170" stroke="rgba(244,239,228,0.30)" stroke-width="1"/><line x1="90" y1="330" x2="1110" y2="330" stroke="rgba(244,239,228,0.30)" stroke-width="2" stroke-dasharray="2,7"/><circle cx="90.0" cy="330" r="7" fill="#d64933" stroke="#f4efe4" stroke-width="2"/><line x1="90.0" y1="288" x2="90.0" y2="320" stroke="rgba(244,239,228,0.16)" stroke-width="1.5"/><text x="90.0" y="180" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#e8b84b" text-anchor="middle">1977</text><text x="90.0" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#f4efe4" text-anchor="middle" letter-spacing="0"><tspan x="90.0" dy="0">Thierry Sabine gets</tspan><tspan x="90.0" dy="17">lost in the Ténéré</tspan><tspan x="90.0" dy="17">desert during the</tspan><tspan x="90.0" dy="17">Abidjan–Nice rally,</tspan><tspan x="90.0" dy="17">and survives.</tspan></text><circle cx="294.0" cy="330" r="7" fill="#d64933" stroke="#f4efe4" stroke-width="2"/><line x1="294.0" y1="372" x2="294.0" y2="340" stroke="rgba(244,239,228,0.16)" stroke-width="1.5"/><text x="294.0" y="388" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#e8b84b" text-anchor="middle">1978</text><text x="294.0" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#f4efe4" text-anchor="middle" letter-spacing="0"><tspan x="294.0" dy="0">The first Paris–Dakar</tspan><tspan x="294.0" dy="17">Rally rolls out of</tspan><tspan x="294.0" dy="17">France, aimed at</tspan><tspan x="294.0" dy="17">Senegal through</tspan><tspan x="294.0" dy="17">unforgiving sand.</tspan></text><circle cx="498.0" cy="330" r="7" fill="#d64933" stroke="#f4efe4" stroke-width="2"/><line x1="498.0" y1="288" x2="498.0" y2="320" stroke="rgba(244,239,228,0.16)" stroke-width="1.5"/><text x="498.0" y="180" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#e8b84b" text-anchor="middle">1994</text><text x="498.0" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#f4efe4" text-anchor="middle" letter-spacing="0"><tspan x="498.0" dy="0">Paris stops being the</tspan><tspan x="498.0" dy="17">fixed start. The route</tspan><tspan x="498.0" dy="17">begins shifting from</tspan><tspan x="498.0" dy="17">year to year.</tspan></text><circle cx="702.0" cy="330" r="7" fill="#d64933" stroke="#f4efe4" stroke-width="2"/><line x1="702.0" y1="372" x2="702.0" y2="340" stroke="rgba(244,239,228,0.16)" stroke-width="1.5"/><text x="702.0" y="388" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#e8b84b" text-anchor="middle">2008</text><text x="702.0" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#f4efe4" text-anchor="middle" letter-spacing="0"><tspan x="702.0" dy="0">The rally is cancelled</tspan><tspan x="702.0" dy="17">days before the start,</tspan><tspan x="702.0" dy="17">over security threats</tspan><tspan x="702.0" dy="17">in Mauritania.</tspan></text><circle cx="906.0" cy="330" r="7" fill="#d64933" stroke="#f4efe4" stroke-width="2"/><line x1="906.0" y1="288" x2="906.0" y2="320" stroke="rgba(244,239,228,0.16)" stroke-width="1.5"/><text x="906.0" y="180" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#e8b84b" text-anchor="middle">2009–19</text><text x="906.0" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#f4efe4" text-anchor="middle" letter-spacing="0"><tspan x="906.0" dy="0">Ten years based in</tspan><tspan x="906.0" dy="17">South America —</tspan><tspan x="906.0" dy="17">Argentina, Chile,</tspan><tspan x="906.0" dy="17">Bolivia, Peru.</tspan></text><circle cx="1110.0" cy="330" r="7" fill="#d64933" stroke="#f4efe4" stroke-width="2"/><line x1="1110.0" y1="372" x2="1110.0" y2="340" stroke="rgba(244,239,228,0.16)" stroke-width="1.5"/><text x="1110.0" y="388" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#e8b84b" text-anchor="middle">2020–</text><text x="1110.0" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13.2" font-weight="normal" fill="#f4efe4" text-anchor="middle" letter-spacing="0"><tspan x="1110.0" dy="0">The Saudi Arabia era</tspan><tspan x="1110.0" dy="17">begins. The name never</tspan><tspan x="1110.0" dy="17">changed.</tspan></text><text x="1140" y="592" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#5b6472" text-anchor="end" letter-spacing="0.5">1977 – 2026</text><text x="60" y="592" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#5b6472" letter-spacing="0.5">DAKAR RALLY GUIDE — INDIA</text></svg>