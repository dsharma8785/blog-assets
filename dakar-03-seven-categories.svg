<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"><rect x="0" y="0" width="1200" height="760" fill="#10161f"/><text x="60" y="66" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#d64933" letter-spacing="2.5">WHO'S ACTUALLY RACING</text><text x="60" y="112" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900" fill="#f4efe4" letter-spacing="0.5">Seven Categories, One Desert</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#c9a876" text-anchor="start" letter-spacing="0"><tspan x="60" dy="0">Bikes, cars, trucks and everything in between run the same roadbook, the same stages, the same dunes.</tspan></text><line x1="60" y1="170" x2="1140" y2="170" stroke="rgba(244,239,228,0.30)" stroke-width="1"/><rect x="60" y="196" width="344" height="150" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)"/><circle cx="90" cy="228" r="16" fill="#d64933"/><text x="90" y="233" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#10161f" text-anchor="middle">01</text><text x="116" y="234" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#f4efe4">Bikes</text><text x="384" y="218" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#c9a876" text-anchor="end" letter-spacing="1">SINCE 1979</text><text x="80" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12.6" font-weight="normal" fill="#c7cdd6" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">Solo riders navigating by roadbook. Includes the</tspan><tspan x="80" dy="16.5">self-supported Malle Moto class.</tspan></text><rect x="428" y="196" width="344" height="150" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)"/><circle cx="458" cy="228" r="16" fill="#e8b84b"/><text x="458" y="233" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#10161f" text-anchor="middle">02</text><text x="484" y="234" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#f4efe4">Cars</text><text x="752" y="218" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#c9a876" text-anchor="end" letter-spacing="1">SINCE 1979</text><text x="448" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12.6" font-weight="normal" fill="#c7cdd6" text-anchor="start" letter-spacing="0"><tspan x="448" dy="0">The 4x4 class in India. Toyota, Ford and Audi</tspan><tspan x="448" dy="16.5">machines at the sharp end of the field.</tspan></text><rect x="796" y="196" width="344" height="150" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)"/><circle cx="826" cy="228" r="16" fill="#c9a876"/><text x="826" y="233" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#10161f" text-anchor="middle">03</text><text x="852" y="234" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#f4efe4">Trucks</text><text x="1120" y="218" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#c9a876" text-anchor="end" letter-spacing="1">SINCE 1979</text><text x="816" y="266" font-family="Arial, Helvetica, sans-serif" font-size="12.6" font-weight="normal" fill="#c7cdd6" text-anchor="start" letter-spacing="0"><tspan x="816" dy="0">Heavy support-class machines that somehow still</tspan><tspan x="816" dy="16.5">jump dunes at speed.</tspan></text><rect x="60" y="370" width="344" height="150" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)"/><circle cx="90" cy="402" r="16" fill="#d64933"/><text x="90" y="407" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#10161f" text-anchor="middle">04</text><text x="116" y="408" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#f4efe4">Challenger (T3)</text><text x="384" y="392" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#c9a876" text-anchor="end" letter-spacing="1">SINCE 2017</text><text x="80" y="440" font-family="Arial, Helvetica, sans-serif" font-size="12.6" font-weight="normal" fill="#c7cdd6" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">Light, buggy-style off-road machines built for</tspan><tspan x="80" dy="16.5">agility over raw power.</tspan></text><rect x="428" y="370" width="344" height="150" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)"/><circle cx="458" cy="402" r="16" fill="#e8b84b"/><text x="458" y="407" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#10161f" text-anchor="middle">05</text><text x="484" y="408" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#f4efe4">SSV (T4)</text><text x="752" y="392" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#c9a876" text-anchor="end" letter-spacing="1">SINCE 2017</text><text x="448" y="440" font-family="Arial, Helvetica, sans-serif" font-size="12.6" font-weight="normal" fill="#c7cdd6" text-anchor="start" letter-spacing="0"><tspan x="448" dy="0">Side-by-side vehicles — a lighter, nimbler cousin</tspan><tspan x="448" dy="16.5">to the main car class.</tspan></text><rect x="796" y="370" width="344" height="150" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)"/><circle cx="826" cy="402" r="16" fill="#c9a876"/><text x="826" y="407" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#10161f" text-anchor="middle">06</text><text x="852" y="408" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#f4efe4">M1000</text><text x="1120" y="392" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#c9a876" text-anchor="end" letter-spacing="1">NEWEST CLASS</text><text x="816" y="440" font-family="Arial, Helvetica, sans-serif" font-size="12.6" font-weight="normal" fill="#c7cdd6" text-anchor="start" letter-spacing="0"><tspan x="816" dy="0">Reserved for alternative and hybrid drivetrains —</tspan><tspan x="816" dy="16.5">Dakar meets the electric motor.</tspan></text><rect x="60" y="544" width="344" height="150" rx="10" fill="#182231" stroke="rgba(244,239,228,0.16)"/><circle cx="90" cy="576" r="16" fill="#d64933"/><text x="90" y="581" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#10161f" text-anchor="middle">07</text><text x="116" y="582" font-family="Arial Black, Arial, sans-serif" font-size="18" font-weight="900" fill="#f4efe4">Classic</text><text x="384" y="566" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#c9a876" text-anchor="end" letter-spacing="1">PAST DECADES</text><text x="80" y="614" font-family="Arial, Helvetica, sans-serif" font-size="12.6" font-weight="normal" fill="#c7cdd6" text-anchor="start" letter-spacing="0"><tspan x="80" dy="0">Genuinely old 4x4s and rally cars, raced by people</tspan><tspan x="80" dy="16.5">who enjoy pain with nostalgia.</tspan></text><text x="1140" y="732" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#5b6472" text-anchor="end" letter-spacing="0.5">7 categories · 1 roadbook</text><text x="60" y="732" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#5b6472" letter-spacing="0.5">DAKAR RALLY GUIDE — INDIA</text></svg>