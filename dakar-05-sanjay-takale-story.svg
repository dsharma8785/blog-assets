<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640"><rect x="0" y="0" width="1200" height="640" fill="#10161f"/><text x="60" y="66" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#d64933" letter-spacing="2.5">SANJAY TAKALE</text><text x="60" y="112" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900" fill="#f4efe4" letter-spacing="0.5">India's 4x4 Story</text><text x="60" y="142" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#c9a876" text-anchor="start" letter-spacing="0"><tspan x="60" dy="0">From a motocross track in Manjri to the first Indian ever to stand on a Dakar podium in a car.</tspan></text><line x1="60" y1="170" x2="1140" y2="170" stroke="rgba(244,239,228,0.30)" stroke-width="1"/><line x1="190" y1="210" x2="190" y2="527.1428571428571" stroke="rgba(244,239,228,0.30)" stroke-width="2" stroke-dasharray="2,7"/><circle cx="190" cy="210.0" r="6.5" fill="#d64933" stroke="#f4efe4" stroke-width="2"/><text x="166" y="215.0" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="bold" fill="#d64933" text-anchor="end">Late 1980s</text><text x="220" y="215.0" font-family="Arial, Helvetica, sans-serif" font-size="13.6" font-weight="normal" fill="#f4efe4" text-anchor="start" letter-spacing="0"><tspan x="220" dy="0">Starts out in motocross near Pune, eventually collecting over a hundred trophies.</tspan></text><circle cx="190" cy="262.8571428571429" r="6.5" fill="#d64933" stroke="#f4efe4" stroke-width="2"/><text x="166" y="267.8571428571429" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="bold" fill="#d64933" text-anchor="end">Career break</text><text x="220" y="267.8571428571429" font-family="Arial, Helvetica, sans-serif" font-size="13.6" font-weight="normal" fill="#f4efe4" text-anchor="start" letter-spacing="0"><tspan x="220" dy="0">Walks away from racing for seven years to backpack, then returns and switches from two wheels to four.</tspan></text><circle cx="190" cy="315.7142857142857" r="6.5" fill="#d64933" stroke="#f4efe4" stroke-width="2"/><text x="166" y="320.7142857142857" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="bold" fill="#d64933" text-anchor="end">Build-up</text><text x="220" y="320.7142857142857" font-family="Arial, Helvetica, sans-serif" font-size="13.6" font-weight="normal" fill="#f4efe4" text-anchor="start" letter-spacing="0"><tspan x="220" dy="0">Competes in the Asia-Pacific Rally Championship and starts a World Rally Championship round in Finland.</tspan></text><circle cx="190" cy="368.57142857142856" r="6.5" fill="#d64933" stroke="#f4efe4" stroke-width="2"/><text x="166" y="373.57142857142856" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="bold" fill="#d64933" text-anchor="end">2025</text><text x="220" y="373.57142857142856" font-family="Arial, Helvetica, sans-serif" font-size="13.6" font-weight="normal" fill="#f4efe4" text-anchor="start" letter-spacing="0"><tspan x="220" dy="0">Dakar debut — the only Indian in the four-wheeler category. Finishes 18th overall in a Toyota Land Cruiser.</tspan></text><circle cx="190" cy="421.42857142857144" r="6.5" fill="#e8b84b" stroke="#f4efe4" stroke-width="2"/><text x="166" y="426.42857142857144" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="bold" fill="#e8b84b" text-anchor="end">2026, Day 1</text><text x="220" y="426.42857142857144" font-family="Arial, Helvetica, sans-serif" font-size="13.6" font-weight="normal" fill="#f4efe4" text-anchor="start" letter-spacing="0"><tspan x="220" dy="0">Tops the Prologue in class H3 — first Indian ever on a Dakar podium in Cars.</tspan></text><circle cx="190" cy="474.2857142857143" r="6.5" fill="#e8b84b" stroke="#f4efe4" stroke-width="2"/><text x="166" y="479.2857142857143" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="bold" fill="#e8b84b" text-anchor="end">2026, Stage 1</text><text x="220" y="479.2857142857143" font-family="Arial, Helvetica, sans-serif" font-size="13.6" font-weight="normal" fill="#f4efe4" text-anchor="start" letter-spacing="0"><tspan x="220" dy="0">Wins Stage 1 outright in H3 — first stage win by an Indian in Dakar's 4x4 category.</tspan></text><circle cx="190" cy="527.1428571428571" r="6.5" fill="#e8b84b" stroke="#f4efe4" stroke-width="2"/><text x="166" y="532.1428571428571" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="bold" fill="#e8b84b" text-anchor="end">2026, Stage 3</text><text x="220" y="532.1428571428571" font-family="Arial, Helvetica, sans-serif" font-size="13.6" font-weight="normal" fill="#f4efe4" text-anchor="start" letter-spacing="0"><tspan x="220" dy="0">Leading H3 through three stages, an engine failure at the bivouac ends his campaign.</tspan></text><text x="1140" y="612" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#5b6472" text-anchor="end" letter-spacing="0.5">Pune → Manjri → Yanbu</text><text x="60" y="612" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#5b6472" letter-spacing="0.5">DAKAR RALLY GUIDE — INDIA</text></svg>